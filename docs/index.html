<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Авансовый отчёт АО-1 — Скачать</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #1e3a5f 0%, #0d2137 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  padding: 20px;
}
.container {
  max-width: 480px;
  width: 100%;
  text-align: center;
}
.logo {
  font-size: 64px;
  margin-bottom: 16px;
}
h1 {
  font-size: 28px;
  margin-bottom: 8px;
  font-weight: 700;
}
.subtitle {
  color: #8ab4f8;
  font-size: 16px;
  margin-bottom: 40px;
}
.card {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: transform 0.2s, background 0.2s;
}
.card:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,0.12);
}
.card h3 {
  font-size: 18px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.card p {
  color: #94a3b8;
  font-size: 14px;
  margin-bottom: 16px;
}
.btn {
  display: inline-block;
  background: #2563eb;
  color: #fff;
  padding: 14px 32px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 600;
  font-size: 15px;
  transition: background 0.2s;
  border: none;
  cursor: pointer;
}
.btn:hover {
  background: #1d4ed8;
}
.btn-secondary {
  background: rgba(255,255,255,0.1);
}
.btn-secondary:hover {
  background: rgba(255,255,255,0.2);
}
.footer {
  margin-top: 32px;
  font-size: 12px;
  color: #64748b;
}
.footer a {
  color: #8ab4f8;
  text-decoration: none;
}
.footer a:hover {
  text-decoration: underline;
}
.version {
  display: inline-block;
  background: rgba(255,255,255,0.15);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  margin-bottom: 24px;
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">📱</div>
  <h1>Авансовый отчёт АО-1</h1>
  <p class="subtitle">Сканируй чеки — получай документы</p>
  
  <span class="version">🔥 Сборка: <span id="build-date">загрузка...</span></span>

  <div class="card">
    <h3>📱 Android</h3>
    <p>Установите APK на телефон или планшет</p>
    <a class="btn" id="apk-link" href="https://github.com/XomyaxX/avanschek/releases/tag/latest" target="_blank">
      Скачать APK
    </a>
  </div>

  <div class="card">
    <h3>🖥️ Windows</h3>
    <p>Для тестирования на ПК (не нужен телефон)</p>
    <a class="btn btn-secondary" id="win-link" href="https://github.com/XomyaxX/avanschek/releases/tag/latest" target="_blank">
      Скачать ZIP
    </a>
  </div>

  <div class="footer">
    <p>Исходный код: <a href="https://github.com/XomyaxX/avanschek">GitHub</a></p>
    <p>Последнее обновление: <span id="last-update">—</span></p>
  </div>
</div>

<script>
// Получаем дату последнего коммита из GitHub API
fetch('https://api.github.com/repos/XomyaxX/avanschek/commits?per_page=1')
  .then(r => r.json())
  .then(data => {
    if (data[0] && data[0].commit && data[0].commit.committer) {
      const date = new Date(data[0].commit.committer.date);
      document.getElementById('build-date').textContent = date.toLocaleDateString('ru-RU');
      document.getElementById('last-update').textContent = date.toLocaleString('ru-RU');
    }
  })
  .catch(() => {
    document.getElementById('build-date').textContent = 'сегодня';
  });
</script>
</body>
</html>
